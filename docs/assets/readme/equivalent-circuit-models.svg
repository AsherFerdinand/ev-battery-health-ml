<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Rint, Thevenin and Dual Polarisation equivalent circuits</title>
<desc id="desc">Each circuit starts with an open-circuit voltage and series ohmic resistance. Thevenin adds one parallel resistor-capacitor polarization branch in series. Dual Polarisation adds a second such branch.</desc>
<defs>
 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#202b3b}.title{font-size:24px;font-weight:700}.model{font-size:18px;font-weight:700}.label{font-size:13px;font-weight:650}.body{font-size:12px;fill:#536273}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.wire{stroke:#526273;stroke-width:2.2;fill:none}.resistor{stroke:#315a9d;stroke-width:2.5;fill:none}.capacitor{stroke:#b36b24;stroke-width:2.5}.terminal{fill:#fff;stroke:#315a9d;stroke-width:2}.port{font-size:12px;font-weight:700;fill:#315a9d}.current{font-size:12px;fill:#315a9d}</style>
</defs>
<rect width="1200" height="500" rx="18" fill="#fff"/>
<text class="title" x="32" y="40">Equivalent-circuit model ladder</text>
<text class="body" x="32" y="64">All models use the same OCV and R₀ foundation; added RC branches represent transient voltage polarization.</text>
<!-- Rint panel -->
<g transform="translate(25 88)"><rect class="panel" width="360" height="360" rx="14"/><text class="model" x="20" y="34">Rint</text><text class="body" x="20" y="55">Instantaneous ohmic response</text>
 <circle cx="55" cy="170" r="24" fill="#fff" stroke="#526273" stroke-width="2"/><text class="label" x="49" y="165">+</text><text class="label" x="51" y="184">−</text><text class="body" x="33" y="210">OCV</text>
 <path class="wire" d="M55 146V110H90M55 194V260H282M90 110H117M177 110H245"/><path class="resistor" d="M117 110l8-12 10 24 10-24 10 24 10-24 12 12"/><text class="label" x="132" y="86">R₀</text><path class="wire" d="M245 110H282"/><circle class="terminal" cx="282" cy="110" r="5"/><circle class="terminal" cx="282" cy="260" r="5"/><text class="port" x="292" y="114">+</text><text class="port" x="292" y="264">−</text><text class="label" x="214" y="290">V terminal</text>
 <text class="body" x="20" y="322">R₀ gives the immediate voltage drop under load.</text>
</g>
<!-- Thevenin -->
<g transform="translate(420 88)"><rect class="panel" width="360" height="360" rx="14"/><text class="model" x="20" y="34">Thevenin</text><text class="body" x="20" y="55">One transient polarization timescale</text>
 <circle cx="45" cy="170" r="22" fill="#fff" stroke="#526273" stroke-width="2"/><text class="label" x="39" y="165">+</text><text class="label" x="41" y="184">−</text><text class="body" x="25" y="210">OCV</text>
 <path class="wire" d="M45 148V110H70M45 192V260H315M70 110H83M143 110H165M245 110H315"/><path class="resistor" d="M83 110l8-12 10 24 10-24 10 24 10-24 12 12"/><text class="label" x="99" y="85">R₀</text>
 <path class="wire" d="M165 110V145M245 110V145M165 145V180M245 145V180"/><path class="resistor" d="M165 180l8-10 10 20 10-20 10 20 10-20 12 10"/><text class="label" x="190" y="166">R₁</text><path class="wire" d="M165 180V215M245 180V215"/><path class="wire" d="M165 215H188M222 215H245"/><path class="capacitor" d="M188 204V226M222 204V226"/><text class="label" x="195" y="246">C₁</text>
 <path class="wire" d="M315 110H330"/><circle class="terminal" cx="330" cy="110" r="5"/><circle class="terminal" cx="330" cy="260" r="5"/><text class="port" x="338" y="114">+</text><text class="port" x="338" y="264">−</text>
 <text class="body" x="20" y="295">R₁ ∥ C₁ adds polarization and recovery</text><text class="body" x="20" y="314">with time constant τ₁ = R₁C₁.</text>
</g>
<!-- Dual polarisation -->
<g transform="translate(815 88)"><rect class="panel" width="360" height="360" rx="14"/><text class="model" x="20" y="34">Dual Polarisation</text><text class="body" x="20" y="55">Fast and slow transient responses</text>
 <circle cx="34" cy="170" r="20" fill="#fff" stroke="#526273" stroke-width="2"/><text class="label" x="29" y="165">+</text><text class="label" x="30" y="184">−</text><text class="body" x="16" y="210">OCV</text>
 <path class="wire" d="M34 150V110H50M34 190V260H326M50 110H60M115 110H127M182 110H194M248 110H326"/><path class="resistor" d="M60 110l7-11 9 22 9-22 9 22 9-22 12 11"/><text class="label" x="73" y="85">R₀</text>
 <path class="wire" d="M127 110V140M182 110V140M127 140V170M182 140V170"/><path class="resistor" d="M127 170l7-9 9 18 9-18 9 18 9-18 12 9"/><text class="label" x="145" y="158">R₁</text><path class="wire" d="M127 170V195M182 170V195M127 195H145M164 195H182"/><path class="capacitor" d="M145 185V205M164 185V205"/><text class="label" x="144" y="225">C₁</text>
 <path class="wire" d="M194 110V140M248 110V140M194 140V170M248 140V170"/><path class="resistor" d="M194 170l7-9 9 18 9-18 9 18 9-18 11 9"/><text class="label" x="209" y="158">R₂</text><path class="wire" d="M194 170V195M248 170V195M194 195H212M230 195H248"/><path class="capacitor" d="M212 185V205M230 185V205"/><text class="label" x="210" y="225">C₂</text>
 <circle class="terminal" cx="326" cy="110" r="5"/><circle class="terminal" cx="326" cy="260" r="5"/><text class="port" x="334" y="114">+</text><text class="port" x="334" y="264">−</text>
 <text class="body" x="20" y="290">R₁ ∥ C₁ and R₂ ∥ C₂ add two</text><text class="body" x="20" y="309">distinct polarization time constants.</text>
</g>
<text class="body" x="28" y="478">Topology follows battery_sim.py: Vₜ = OCV(SOC) − I·R₀ − ΣVₚ. RC branches add modeled transient states; these are lumped circuits, not electrochemical chemistry models.</text>
</svg>
